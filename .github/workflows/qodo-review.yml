name: Qodo Review

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    # Trigger on:
    # 1. Any new/reopened PR
    # 2. When CodeRabbitAI posts a review (Qodo reads it and gives final verdict)
    # 3. When DeepSource posts a review
    # 4. Manual /review comment
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && (
        github.event.review.user.login == 'coderabbitai[bot]' ||
        github.event.review.user.login == 'deepsource-io[bot]'
      )) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    name: Run Qodo on PR
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
